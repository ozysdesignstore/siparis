<script>
  // ============================================================
  // AYAR: Apps Script web uygulaması adresinizi (https:// ile
  // başlayan, /exec ile biten) tırnakların içine yapıştırın.

  // ============================================================

  (function () {
    var kap = document.getElementById('uygulama');
    var adresHazir = typeof WEB_APP_URL === 'string'
      && WEB_APP_URL.indexOf('https://') === 0
      && WEB_APP_URL.indexOf('BURAYA_') === -1;

    if (!adresHazir) {
      var kutu = document.createElement('div');
      kutu.className = 'uyari';
      var baslik = document.createElement('h1');
      baslik.textContent = 'Adres henüz ayarlanmadı';
      var metin = document.createElement('p');
      metin.textContent = 'Bu dosyada WEB_APP_URL satırındaki BURAYA_WEB_APP_ADRESINI_YAPISTIRIN yazısını, Apps Script web uygulaması adresinizle değiştirin.';

      kutu.appendChild(metin);
      kap.appendChild(kutu);
      return;
    }

    // Safari gömülü uygulamanın hafızasını sildiği için PIN bu sayfada saklanır
    var kayitliPin = '';
    try { kayitliPin = localStorage.getItem('sp_pin') || ''; } catch (e) {}
    var adres = WEB_APP_URL + (WEB_APP_URL.indexOf('?') === -1 ? '?' : '&') + 'o=' + encodeURIComponent(location.origin)
      + (kayitliPin ? '&pin=' + encodeURIComponent(kayitliPin) : '');
    window.addEventListener('message', function (ev) {
      if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(ev.origin)) return;
      var d = ev.data || {};
      try {
        if (d.tip === 'sp_pin' && /^\d{1,12}$/.test(String(d.pin))) localStorage.setItem('sp_pin', String(d.pin));
        if (d.tip === 'sp_cikis') localStorage.removeItem('sp_pin');
      } catch (e) {}
    });

    var iframe = document.createElement('iframe');
    iframe.src = adres;
    iframe.title = 'Sipariş Takip';
    iframe.setAttribute('allow', 'clipboard-write');
    kap.appendChild(iframe);
  })();
</script>
</body>
</html>
